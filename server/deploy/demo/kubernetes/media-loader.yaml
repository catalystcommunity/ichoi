apiVersion: v1
kind: Pod
metadata:
  name: ichoi-demo-media-loader
  namespace: ichoi-demo
  labels:
    app.kubernetes.io/name: ichoi
    app.kubernetes.io/component: media-loader
    app.kubernetes.io/part-of: ichoi-demo
spec:
  restartPolicy: Never
  containers:
    - name: media-loader
      image: alpine:3.22
      command:
        - /bin/sh
        - -c
        - sleep 604800
      resources:
        requests:
          cpu: 10m
          memory: 16Mi
        limits:
          cpu: 100m
          memory: 64Mi
      volumeMounts:
        - name: media
          mountPath: /media
  volumes:
    - name: media
      persistentVolumeClaim:
        claimName: ichoi-demo-media
