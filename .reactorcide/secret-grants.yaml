# Desired secret grants for the Ichoi project.
#
# Review the live grants and use a dry run before you apply this file. The file does not use
# prune because an apply must not remove an unrecorded production grant.
apiVersion: reactorcide.catalystcommunity.io/v1alpha1
kind: SecretGrantList
items:
  - metadata:
      name: ichoi-release-tag-ci
    spec:
      scope:
        project: github.com/catalystcommunity/ichoi
      secret:
        path: catalystcommunity/ci
        match: exact
      subject:
        jobName:
          value: ichoi-release-tag
          match: exact
      executionProfiles: [standard]
      ciOrigins: [base]
      description: "Create version tags and push the version commit."

  - metadata:
      name: ichoi-release-prepare-ci
    spec:
      scope:
        project: github.com/catalystcommunity/ichoi
      secret:
        path: catalystcommunity/ci
        match: exact
      subject:
        jobName:
          value: ichoi-release-prepare
          match: exact
      executionProfiles: [standard]
      ciOrigins: [base]
      description: "Verify the tag and create the draft release."

  - metadata:
      name: ichoi-release-publish-ci
    spec:
      scope:
        project: github.com/catalystcommunity/ichoi
      secret:
        path: catalystcommunity/ci
        match: exact
      subject:
        jobName:
          value: ichoi-release-publish
          match: exact
      executionProfiles: [standard]
      ciOrigins: [base]
      description: "Upload archives and publish the draft release."

  - metadata:
      name: ichoi-release-prepare-cache
    spec:
      scope:
        project: github.com/catalystcommunity/ichoi
      secret:
        path: catalystcommunity/asset-cache
        match: exact
      subject:
        jobName:
          value: ichoi-release-prepare
          match: exact
      executionProfiles: [standard]
      ciOrigins: [base]
      description: "Create exact-object upload URLs for release builders."

  - metadata:
      name: ichoi-release-seal-cache
    spec:
      scope:
        project: github.com/catalystcommunity/ichoi
      secret:
        path: catalystcommunity/asset-cache
        match: exact
      subject:
        jobName:
          value: ichoi-asset-seal
          match: exact
      executionProfiles: [standard]
      ciOrigins: [base]
      description: "Verify and seal staged release archives."

  - metadata:
      name: ichoi-release-publish-cache
    spec:
      scope:
        project: github.com/catalystcommunity/ichoi
      secret:
        path: catalystcommunity/asset-cache
        match: exact
      subject:
        jobName:
          value: ichoi-release-publish
          match: exact
      executionProfiles: [standard]
      ciOrigins: [base]
      description: "Read sealed archives for GitHub publication."

  - metadata:
      name: ichoi-release-cleanup-cache
    spec:
      scope:
        project: github.com/catalystcommunity/ichoi
      secret:
        path: catalystcommunity/asset-cache
        match: exact
      subject:
        jobName:
          value: ichoi-asset-cleanup
          match: exact
      executionProfiles: [standard]
      ciOrigins: [base]
      description: "Remove expired Ichoi asset-cache lanes."

  - metadata:
      name: ichoi-deploy-registry
    spec:
      scope:
        project: github.com/catalystcommunity/ichoi
      secret:
        path: catalystcommunity/registry
        match: exact
      subject:
        jobName:
          value: ichoi-server-build-and-deploy
          match: exact
      executionProfiles: [standard]
      ciOrigins: [base]
      description: "Push multi-architecture server images."
