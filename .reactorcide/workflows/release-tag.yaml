name: Ichoi Release Tag
id: ichoi-release-tag
description: "Calculate and push release tags after a merge."

# semver-tags creates each target tag (server/vX.Y.Z, website/vX.Y.Z). This workflow then
# stamps <target>/version/VERSION.txt. The version commit starts the server image deployment
# or the website deployment. A server tag also starts the release workflow.
on:
  events:
    - pull_request_merged
  branches:
    - main

jobs:
  ichoi-release-tag:
    job_file: release-tag.yaml
