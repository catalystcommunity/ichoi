name: Ichoi Release Tag
id: ichoi-release-tag
description: "Calculate and push release tags after a merge."

# semver-tags creates each target tag. This workflow then stamps the version file. The
# version commit starts the image deployment workflow. The tag starts the release workflow.
on:
  events:
    - pull_request_merged
  branches:
    - main

jobs:
  ichoi-release-tag:
    job_file: release-tag.yaml
