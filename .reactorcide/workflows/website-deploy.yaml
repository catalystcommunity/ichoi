name: Ichoi Website Deploy
id: ichoi-website-deploy
description: "Deploy the project website when website/version/VERSION.txt changes on main."

# The release-tag workflow writes this file after semver-tags creates a website/vX.Y.Z tag.
# Do not edit the file by hand. A conventional fix: or feat: commit in website/ releases the site.
on:
  events:
    - push
  branches:
    - main

paths:
  include:
    - "website/version/VERSION.txt"

jobs:
  ichoi-website-check:
    job_file: website-check.yaml

  ichoi-website-deploy:
    job_file: website-deploy.yaml
    depends_on:
      - ichoi-website-check
