name: ichoi-conventional-commits
description: "Validate that all pull-request commits use the conventional commit format."
job:
  image: containers.catalystsquad.com/public/reactorcide/runnerbase:latest
  command: "runnerlib run --job-command true"
  timeout: 300
  priority: 10
  working_dir: /job
  run_as:
    user: runner
environment:
  ICHOI_CI_JOB: conventional-commits
run_local:
  user: host
