name: ichoi-test-sqlite
description: "Run the workspace test suite against the SQLite backend"
# Compatibility trigger; see build.yaml.
triggers:
  events:
    - pull_request_opened
    - pull_request_updated
  branches:
    - main
depends_on:
  - ichoi-conventional-commits
job:
  image: containers.catalystsquad.com/public/reactorcide/runnerbase:v0.8.11
  command: "runnerlib run --job-command true"
  timeout: 1800
  priority: 10
  working_dir: /job
  run_as:
    user: runner
environment:
  REACTORCIDE_ICHOI_CI_JOB: test-sqlite
run_local:
  as_runner: true
