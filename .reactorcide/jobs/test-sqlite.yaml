name: ichoi-test-sqlite
description: "Run the workspace test suite against the SQLite backend."
job:
  image: containers.catalystsquad.com/public/reactorcide/runnerbase:latest
  command: "runnerlib run --job-command true"
  timeout: 1800
  priority: 10
  working_dir: /job
  run_as:
    user: runner
environment:
  ICHOI_CI_JOB: test-sqlite
run_local:
  user: host
