name: ichoi-server-build-test
description: "Verify that the Ichoi server Docker image builds on a pull request."
job:
  image: containers.catalystsquad.com/public/reactorcide/runnerbase:latest
  command: "runnerlib run --job-command true"
  timeout: 3600
  working_dir: /job
  capabilities:
    - builder
  run_as:
    user: runner
environment:
  ICHOI_IMAGE_JOB: build-test
