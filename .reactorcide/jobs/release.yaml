name: ichoi-release
description: "Version bump with semver-tags and create a GitHub release on merge to main"
# Compatibility trigger; see build.yaml.
triggers:
  events:
    - pull_request_merged
  branches:
    - main
job:
  image: containers.catalystsquad.com/public/reactorcide/runnerbase:v0.8.11
  command: "runnerlib run --job-command true"
  timeout: 3600
  priority: 15
  working_dir: /job
  # The only job that stays off run-local: it pushes to main and publishes releases. The job
  # code still honours SKIP_GITHUB=true (stamp the version files and build the archives, push
  # and publish nothing), so this flag can be lifted for a local dry run.
  disable_run_local: true
  run_as:
    user: runner
environment:
  REACTORCIDE_ICHOI_RELEASE_JOB: release
  GITHUB_PAT: "${secret:catalystcommunity/ci:githubpat}"
