name: ichoi-website-deploy
description: "Build and push the website image, roll the Helm release, and apply the route."
job:
  image: containers.catalystsquad.com/public/reactorcide/runnerbase:latest
  command: "runnerlib run --job-command true"
  timeout: 1800
  working_dir: /job
  # A BuildKit sidecar builds the image.
  capabilities:
    - builder
  run_as:
    user: runner
environment:
  ICHOI_WEBSITE_JOB: deploy
  REGISTRY: "containers.catalystsquad.com"
  REGISTRY_PATH: "public/catalystcommunity/ichoi-website"
  REGISTRY_USER: "${secret:catalystcommunity/registry:user}"
  REGISTRY_PASSWORD: "${secret:catalystcommunity/registry:password}"
  KUBECONFIG_CONTENT: "${secret:catalystcommunity/k8s:kubeconfig}"
  K8S_NAMESPACE: "ichoi-website"
  HELM_RELEASE: "ichoi-website"
