name: ichoi-server-build-and-deploy
description: "Build and push the amd64 and arm64 Ichoi server image."
job:
  image: containers.catalystsquad.com/public/reactorcide/runnerbase:latest
  command: "runnerlib run --job-command true"
  timeout: 3600
  working_dir: /job
  capabilities:
    - builder
  run_as:
    user: runner
environment:
  ICHOI_IMAGE_JOB: build-and-deploy
  REGISTRY_INTERNAL: "containers.catalystsquad.com"
  REGISTRY_INTERNAL_PATH: "public/catalystcommunity/ichoi"
  # REGISTRY_EXTERNAL / REGISTRY_EXTERNAL_PATH are optional: set them to publish the same
  # image to a SECOND registry, best effort, after the push above has landed. They used to
  # repeat the internal values, which cost a second buildctl invocation and reported an
  # "external push succeeded" for a push to the image that already existed. The job now
  # skips an external registry that resolves to the internal one.
  REGISTRY_USER: "${secret:catalystcommunity/registry:user}"
  REGISTRY_PASSWORD: "${secret:catalystcommunity/registry:password}"
