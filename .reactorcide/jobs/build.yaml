name: ichoi-build
description: "Build the Ichoi workspace for amd64 and arm64 static musl targets."
job:
  image: containers.catalystsquad.com/public/reactorcide/runnerbase:latest
  command: "runnerlib run --job-command true"
  timeout: 2400
  priority: 10
  working_dir: /job
  run_as:
    user: runner
environment:
  ICHOI_CI_JOB: build
run_local:
  user: host
