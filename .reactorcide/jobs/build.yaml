name: ichoi-build
description: "Build the ichoi workspace for amd64 and arm64 (static musl targets)"
# Compatibility trigger: an eval image that predates workflow support reads job files only
# and ignores .reactorcide/workflows/. Remove these once every project runs a runnerbase
# that logs "Loaded N workflow definition(s)".
triggers:
  events:
    - pull_request_opened
    - pull_request_updated
  branches:
    - main
depends_on:
  - ichoi-conventional-commits
job:
  image: containers.catalystsquad.com/public/reactorcide/runnerbase:v0.8.11
  command: "runnerlib run --job-command true"
  timeout: 2400
  priority: 10
  working_dir: /job
  run_as:
    user: runner
environment:
  REACTORCIDE_ICHOI_CI_JOB: build
run_local:
  as_runner: true
