name: ichoi-website-check
description: "Build the project website and check the committed output matches its source."
job:
  image: containers.catalystsquad.com/public/reactorcide/runnerbase:latest
  command: "runnerlib run --job-command true"
  timeout: 900
  working_dir: /job
environment:
  ICHOI_WEBSITE_JOB: check
